<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 復古彈珠台</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        h1 {
            margin: 10px 0;
            color: #ff00ff;
            text-shadow: 0 0 10px #ff00ff;
            font-size: 2em;
        }

        .game-container {
            position: relative;
            border: 4px solid #00ffff;
            box-shadow: 0 0 20px #00ffff;
            background: #000;
        }

        canvas {
            display: block;
        }

        .ui {
            margin-top: 10px;
            display: flex;
            gap: 20px;
            font-size: 1.2em;
        }

        .score { color: #00ff00; }
        .lives { color: #ff0000; }

        .controls {
            margin-top: 10px;
            color: #aaa;
            font-size: 0.9em;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            display: none;
        }

        .overlay.active { display: flex; }

        .overlay h2 {
            font-size: 3em;
            color: #ff00ff;
            margin-bottom: 20px;
        }

        .btn {
            background: #00ffff;
            color: #000;
            border: none;
            padding: 10px 30px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.2s;
        }

        .btn:hover { background: #fff; }
    </style>
</head>
<body>

    <h1>🎰 RETRO PINBALL</h1>

    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div class="overlay" id="gameOverOverlay">
            <h2>GAME OVER</h2>
            <p>最終得分: <span id="finalScore">0</span></p>
            <button class="btn" onclick="resetGame()">再玩一次</button>
        </div>
    </div>

    <div class="ui">
        <div class="score">得分: <span id="scoreVal">0</span></div>
        <div class="lives">生命: <span id="livesVal">3</span></div>
    </div>

    <div class="controls">
        控制: <strong>← 左方向鍵</strong> (左擋板) | <strong>→ 右方向鍵</strong> (右擋板)<br>
        按 <strong>空白鍵</strong> 發球 (如果球在發球區)
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('scoreVal');
        const livesEl = document.getElementById('livesVal');
        const finalScoreEl = document.getElementById('finalScore');
        const overlay = document.getElementById('gameOverOverlay');

        // 遊戲參數
        const width = canvas.width;
        const height = canvas.height;
        const gravity = 0.15;
        const friction = 0.99;
        const bounce = 0.7;

        // 遊戲狀態
        let score = 0;
        let lives = 3;
        let isGameOver = false;
        let balls = [];
        let obstacles = [];
        let flippers = [];

        // 輸入狀態
        const keys = { ArrowLeft: false, ArrowRight: false, Space: false };

        // --- 類別定義 ---

        class Ball {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = 0;
                this.radius = 8;
                this.active = true;
            }

            update() {
                if (!this.active) return;

                this.vy += gravity;
                this.vx *= friction;
                this.vy *= friction;

                this.x += this.vx;
                this.y += this.vy;

                // 邊界碰撞
                if (this.x - this.radius < 0) {
                    this.x = this.radius;
                    this.vx *= -bounce;
                    addScore(10);
                }
                if (this.x + this.radius > width) {
                    this.x = width - this.radius;
                    this.vx *= -bounce;
                    addScore(10);
                }
                if (this.y - this.radius < 0) {
                    this.y = this.radius;
                    this.vy *= -bounce;
                    addScore(10);
                }

                // 掉到底部
                if (this.y - this.radius > height) {
                    this.active = false;
                    loseLife();
                }

                // 障礙物碰撞
                obstacles.forEach(obs => {
                    const dx = this.x - obs.x;
                    const dy = this.y - obs.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < this.radius + obs.radius) {
                        // 簡單反彈
                        const angle = Math.atan2(dy, dx);
                        const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
                        this.vx = Math.cos(angle) * speed * 1.2; // 加速
                        this.vy = Math.sin(angle) * speed * 1.2;
                        addScore(50);
                    }
                });

                // 擋板碰撞
                flippers.forEach(flip => {
                    if (flip.checkCollision(this)) {
                        addScore(20);
                    }
                });
            }

            draw() {
                if (!this.active) return;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();
                ctx.strokeStyle = '#00ffff';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        class Obstacle {
            constructor(x, y, r) {
                this.x = x;
                this.y = y;
                this.radius = r;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ff00ff';
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        class Flipper {
            constructor(x, y, type) {
                this.pivotX = x;
                this.pivotY = y;
                this.type = type; // 'left' or 'right'
                this.length = 60;
                this.width = 10;
                this.angle = type === 'left' ? Math.PI / 6 : -Math.PI / 6; // 初始角度
                this.targetAngle = type === 'left' ? -Math.PI / 6 : Math.PI / 6; // 抬起角度
                this.isMoving = false;
            }

            update() {
                const target = keys[this.type === 'left' ? 'ArrowLeft' : 'ArrowRight'] ? this.targetAngle : (this.type === 'left' ? Math.PI / 6 : -Math.PI / 6);
                
                // 簡單的插值動畫
                const diff = target - this.angle;
                this.angle += diff * 0.2;
            }

            checkCollision(ball) {
                if (!ball.active) return false;

                // 計算擋板末端的坐標
                const endX = this.pivotX + Math.cos(this.angle) * this.length;
                const endY = this.pivotY + Math.sin(this.angle) * this.length;

                // 簡單的線段與圓碰撞檢測 (簡化版)
                // 計算球到線段的距離
                const dx = endX - this.pivotX;
                const dy = endY - this.pivotY;
                const lenSq = dx*dx + dy*dy;
                let t = ((ball.x - this.pivotX) * dx + (ball.y - this.pivotY) * dy) / lenSq;
                t = Math.max(0, Math.min(1, t));
                
                const closestX = this.pivotX + t * dx;
                const closestY = this.pivotY + t * dy;
                
                const distX = ball.x - closestX;
                const distY = ball.y - closestY;
                const dist = Math.sqrt(distX*distX + distY*distY);

                if (dist < ball.radius + this.width/2) {
                    // 反彈邏輯
                    const normalAngle = Math.atan2(distY, distX);
                    const speed = Math.sqrt(ball.vx*ball.vx + ball.vy*ball.vy);
                    
                    // 如果擋板正在向上運動，給球更多力
                    const flipperMovingUp = (this.type === 'left' && keys.ArrowLeft) || (this.type === 'right' && keys.ArrowRight);
                    const force = flipperMovingUp ? 1.5 : 1.0;

                    ball.vx = Math.cos(normalAngle) * speed * force * 1.2;
                    ball.vy = Math.sin(normalAngle) * speed * force * 1.2;
                    
                    // 防止球卡在擋板裡
                    ball.x += Math.cos(normalAngle) * (ball.radius + this.width/2 - dist + 1);
                    ball.y += Math.sin(normalAngle) * (ball.radius + this.width/2 - dist + 1);
                    
                    return true;
                }
                return false;
            }

            draw() {
                ctx.save();
                ctx.translate(this.pivotX, this.pivotY);
                ctx.rotate(this.angle);
                ctx.fillStyle = this.type === 'left' ? '#00ff00' : '#ffff00';
                ctx.fillRect(0, -this.width/2, this.length, this.width);
                ctx.restore();
            }
        }

        // --- 遊戲邏輯 ---

        function initGame() {
            score = 0;
            lives = 3;
            isGameOver = false;
            scoreEl.textContent = score;
            livesEl.textContent = lives;
            overlay.classList.remove('active');
            
            balls = [];
            obstacles = [];
            flippers = [];

            // 生成障礙物
            obstacles.push(new Obstacle(width/2, 150, 20));
            obstacles.push(new Obstacle(width/3, 250, 15));
            obstacles.push(new Obstacle(width*2/3, 250, 15));
            obstacles.push(new Obstacle(width/2, 350, 10));

            // 生成擋板
            flippers.push(new Flipper(120, 550, 'left'));
            flippers.push(new Flipper(280, 550, 'right'));

            spawnBall();
        }

        function spawnBall() {
            if (lives <= 0) {
                gameOver();
                return;
            }
            // 從右側發球區發球
            balls.push(new Ball(380, 500));
        }

        function addScore(points) {
            score += points;
            scoreEl.textContent = score;
        }

        function loseLife() {
            lives--;
            livesEl.textContent = lives;
            // 移除所有不活躍的球
            balls = balls.filter(b => b.active);
            
            if (balls.length === 0) {
                if (lives > 0) {
                    setTimeout(spawnBall, 1000);
                } else {
                    gameOver();
                }
            }
        }

        function gameOver() {
            isGameOver = true;
            finalScoreEl.textContent = score;
            overlay.classList.add('active');
        }

        function resetGame() {
            initGame();
        }

        // --- 主迴圈 ---

        function update() {
            if (isGameOver) return;

            flippers.forEach(f => f.update());
            
            balls.forEach(b => b.update());
            
            // 清理不活躍的球
            balls = balls.filter(b => b.active);
        }

        function draw() {
            // 清空
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);

            // 繪製發球區線
            ctx.strokeStyle = '#333';
            ctx.beginPath();
            ctx.moveTo(width - 40, 0);
            ctx.lineTo(width - 40, height);
            ctx.stroke();

            // 繪製障礙物
            obstacles.forEach(o => o.draw());

            // 繪製擋板
            flippers.forEach(f => f.draw());

            // 繪製球
            balls.forEach(b => b.draw());
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // --- 事件監聽 ---

        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft') keys.ArrowLeft = true;
            if (e.code === 'ArrowRight') keys.ArrowRight = true;
            if (e.code === 'Space') {
                // 如果有球在發球區 (右側)，可以發球
                const ballInLauncher = balls.find(b => b.x > width - 50 && b.y > 400 && b.active);
                if (ballInLauncher) {
                    ballInLauncher.vy = -15; // 向上發射
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft') keys.ArrowLeft = false;
            if (e.code === 'ArrowRight') keys.ArrowRight = false;
        });

        // 啟動
        initGame();
        loop();

    </script>
</body>
</html>
